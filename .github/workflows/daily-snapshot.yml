name: Publish SergipePrevidencia Wayback Pages

on:
  # Publica automaticamente no GitHub Pages sempre que um snapshot for enviado para a branch main
  push:
    branches:
      - main
    paths:
      - 'archive/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-wayback-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do repositório atualizado
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar pacote para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./archive

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
